name: Issue to post

# Write a blog post from your phone: open an issue, title = post title,
# body = content, labels = tags. Add the `draft` label to keep it hidden.
on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, deleted]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: issue-to-post-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Convert issue to Hugo post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOWED_AUTHORS: 5carecrow
          SITE_BASE_URL: https://5carecrow.github.io
        run: python3 scripts/issue-to-post.py

      # Pushes made with GITHUB_TOKEN do not trigger push workflows, so
      # explicitly dispatch the deploy (and the secret scan) here.
      - name: Trigger deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --repo "$REPO" --ref main

      - name: Trigger secret scan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run secret-scan.yml --repo "$REPO" --ref main
