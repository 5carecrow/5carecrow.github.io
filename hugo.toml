baseURL = "https://5carecrow.github.io/"
locale = "zh-cn"
title = "5carecrow 的博客"
theme = "Stack"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/posts/:slug/"
  page = "/:slug/"

[languages]
  [languages.zh-cn]
    label = "简体中文"
    title = "5carecrow 的博客"
    weight = 1
    [languages.zh-cn.params.sidebar]
      subtitle = "记录 AI、开发与生活中的发现"

[params]
  mainSections = ["posts"]
  featuredImageField = "image"
  rssFullContent = true
  favicon = "favicon.ico"

  [params.footer]
    since = 2026
    customText = ""

  [params.dateFormat]
    published = "2006-01-02"
    lastUpdated = "2006-01-02 15:04 MST"

  [params.sidebar]
    emoji = "🌱"
    subtitle = "记录 AI、开发与生活中的发现"
    [params.sidebar.avatar]
      enabled = false
      local = true
      src = "img/avatar.png"

  [params.article]
    headingAnchor = true
    math = false
    toc = true
    readingTime = true
    [params.article.license]
      enabled = false
      default = "Licensed under CC BY-NC-SA 4.0"

  [params.comments]
    enabled = false

  [params.opengraph]
    card = "summary_large_image"

  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.imageProcessing.cover]
    enabled = true

  [params.imageProcessing.content]
    enabled = true

[[params.widgets.homepage]]
type = "search"

[[params.widgets.homepage]]
type = "archives"
params = { limit = 5 }

[[params.widgets.homepage]]
type = "categories"
params = { limit = 10 }

[[params.widgets.homepage]]
type = "tag-cloud"
params = { limit = 10 }

[[params.widgets.page]]
type = "toc"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = -50

  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/5carecrow"
    params = { icon = "brand-github" }

[related]
  includeNewer = true
  threshold = 60
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 200

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["\\[", "\\]"], ["$$", "$$"]]
    inline = [["\\(", "\\)"]]

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  endLevel = 4
  ordered = true
  startLevel = 2

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
  lineNos = true
  lineNumbersInTable = true
  tabWidth = 4
