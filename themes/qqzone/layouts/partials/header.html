<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-star">★</span>
      <span class="brand-text">{{ .Site.Params.qqzone.brand | default "GH空间" }}</span>
    </a>
    <nav class="nav">
      {{ range .Site.Menus.main.ByWeight }}
      <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="topbar-right">
      <a class="top-search" href="{{ "/search/" | relURL }}">🔍 搜索</a>
      <a class="top-ico" href="{{ .Site.Params.qqzone.github }}" target="_blank" rel="noopener" title="GitHub">⌘</a>
    </div>
  </div>
</header>

<div class="banner">
  <div class="starfield"></div>
  <div class="banner-star">★</div>
  <div class="banner-inner">
    <div class="banner-title">{{ .Site.Params.qqzone.bannerTitle | default (printf "%s 的空间" .Site.Params.qqzone.nickname) }}</div>
    <div class="banner-sub">{{ .Site.Params.qqzone.signature }}</div>
    <a class="banner-avatar" href="{{ "/about/" | relURL }}" title="关于我">
      <img src="{{ (.Site.Params.qqzone.avatar | default "avatar.jpg") | relURL }}" alt="avatar">
    </a>
  </div>
</div>
