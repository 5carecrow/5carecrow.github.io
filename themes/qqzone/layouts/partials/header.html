<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-star">★</span>
      <span class="brand-text">{{ .Site.Params.qqzone.brand | default "QQ空间" }}</span>
    </a>
    <nav class="nav">
      {{ range .Site.Menus.main.ByWeight }}
      <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <a class="top-search" href="{{ "/search/" | relURL }}">搜索</a>
  </div>
</header>
<div class="banner">
  <div class="banner-inner">
    <div class="banner-title">{{ .Site.Title }}</div>
    <div class="banner-sub">{{ .Site.Params.qqzone.signature }}</div>
  </div>
</div>
