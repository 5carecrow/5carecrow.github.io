<article class="feed-item">
  <img class="feed-avatar" src="{{ ($.Site.Params.qqzone.avatar | default "avatar.jpg") | relURL }}" alt="avatar">
  <div class="feed-body">
    <div class="feed-head">
      <a class="feed-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <span class="feed-time">{{ .Date.Format "2006-01-02 15:04" }}</span>
    </div>
    <p class="feed-text">{{ .Summary | plainify | truncate 160 }}</p>
    <div class="feed-foot">
      {{ with .Params.tags }}<span class="feed-tags"># {{ delimit . "  # " }}</span>{{ end }}
      <a class="feed-more" href="{{ .RelPermalink }}">阅读全文 »</a>
    </div>
  </div>
</article>
