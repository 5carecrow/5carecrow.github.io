<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "zh-CN" }}">
{{ partial "head.html" . }}
<body class="{{ if .IsHome }}home{{ else }}{{ .Section }}{{ end }}">
  {{ partial "header.html" . }}
  <div class="page-wrap">
    {{ partial "left-nav.html" . }}
    <main class="main-col">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "right-col.html" . }}
  </div>
  {{ partial "footer.html" . }}
  <script src="{{ "js/qqzone.js" | relURL }}"></script>
</body>
</html>
