{{ define "main" }}
<section class="mod">
  <div class="mod-hd"><span class="mod-ico ico-note"></span>留言板</div>
  <div class="mod-bd">
    <p class="gb-tip">这是静态站点的本地留言板：留言只保存在你自己的浏览器里，不会上传到服务器。</p>
    <form id="qq-guestbook-form" class="gb-form">
      <label for="gb-name">昵称</label>
      <input id="gb-name" type="text" maxlength="20" placeholder="怎么称呼你" required>
      <label for="gb-text">留言内容</label>
      <textarea id="gb-text" maxlength="300" placeholder="写点什么吧…" required></textarea>
      <button type="submit">写下留言</button>
    </form>
    <div id="qq-guestbook-list" class="gb-list"></div>
  </div>
</section>
{{ end }}
